apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleaner-con
spec:
  schedule: "*/3 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cleaner
            image: busybox:1.28
            command:
            - /bin/sh
            - -c
            - echo cleanup task
          restartPolicy: OnFailure
