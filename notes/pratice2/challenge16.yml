apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: busybox-daemon
  namespace: default
  labels:
    app: busybox-daemon-app
spec:
  selector:
    matchLabels:
      app: busybox-daemon-app
  template:
    metadata:
      labels:
        app: busybox-daemon-app
    spec:
      
      containers:
      - name: busybox-daemon-app
        image: busybox
        command: ["sleep", "3600"]
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 200Mi
        